<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
  h1 { color: #ddd; font-size: 16px; font-weight: 500; margin: 0 0 12px; letter-spacing: 0.02em; }
  .ba-wrap { position: relative; width: 90vw; max-width: 900px; overflow: hidden; cursor: col-resize; user-select: none; border-radius: 6px; }

  /* After panel (post) — full width base layer */
  .ba-after { position: relative; }
  .ba-after img { display: block; width: 100%; }
  .ba-after .ba-label {
    position: absolute; bottom: 16px; right: 16px;
  }

  /* Before panel (pre) — clipped on top */
  .ba-before {
    position: absolute; top: 0; left: 0;
    height: 100%; overflow: hidden;
  }
  .ba-before img {
    display: block;
    width: var(--ba-full-width);
    max-width: none;
  }
  .ba-before .ba-label {
    position: absolute; bottom: 16px; left: 16px;
  }

  .ba-label {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    color: #fff;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .ba-divider {
    position: absolute; top: 0;
    width: 2px; height: 100%;
    background: white;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .ba-handle {
    position: absolute; top: 50%;
    width: 44px; height: 44px;
    background: white; border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    pointer-events: none;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }
  .arr { width: 0; height: 0; border-style: solid; }
  .arr-l { border-width: 6px 8px 6px 0; border-color: transparent #555 transparent transparent; }
  .arr-r { border-width: 6px 0 6px 8px; border-color: transparent transparent transparent #555; }
  p { color: #888; font-size: 12px; margin: 10px 0 0; }
</style>

<p>Drag the slider to compare</p>

<script>
(function() {
  const wrap    = document.getElementById('baWrap');
  const before  = document.getElementById('baBefore');
  const divider = document.getElementById('baDivider');
  const handle  = document.getElementById('baHandle');
  const afterImg = document.getElementById('baAfterImg');
  let dragging = false;

  function setWidth() {
    wrap.style.setProperty('--ba-full-width', wrap.offsetWidth + 'px');
  }

  function setPos(pct) {
    before.style.width = pct + '%';
    divider.style.left = pct + '%';
    handle.style.left  = pct + '%';
  }

  function onMove(clientX) {
    const r = wrap.getBoundingClientRect();
    const pct = Math.min(100, Math.max(0, (clientX - r.left) / r.width * 100));
    setPos(pct);
  }

  function init() {
    setWidth();
    setPos(100);
  }

  afterImg.addEventListener('load', init);
  window.addEventListener('resize', () => { setWidth(); });
  init();

  wrap.addEventListener('mousedown',  e => { dragging=true; onMove(e.clientX); });
  window.addEventListener('mousemove',e => { if(dragging) onMove(e.clientX); });
  window.addEventListener('mouseup',  () => dragging=false);
  wrap.addEventListener('touchstart', e => { dragging=true; onMove(e.touches[0].clientX); }, {passive:true});
  window.addEventListener('touchmove',e => { if(dragging) onMove(e.touches[0].clientX); }, {passive:true});
  window.addEventListener('touchend', () => dragging=false);
})();
</script>
